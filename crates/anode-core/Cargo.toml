[package]
name = "anode-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Anode writer — persistence, books, pages"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = "1.0"
rmp-serde = "1.1"
sha2 = "0.10"
zstd = "0.13"
